[project]
name = "mdlogger"
dynamic = ["version"]
description = "MDLogger — 듀얼 한 판마다 결과를 빠르게 기록하는 데스크톱 앱"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.14,<3.16"
dependencies = [
    "PySide6-Essentials>=6.12.0,<7",
    "pyqtgraph>=0.14.0,<1",
    "numpy>=2.5.4,<3",  # NumPy 1→2 ABI 경계를 넘지 않는다(하드닝 N-6)
    "openpyxl>=3.1.5,<4",
    "keyring>=25.7.0,<27",
]

[project.scripts]
mdlogger = "mdlogger.app:main"
mdlogger-admin = "mdlogger.admin_app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pyinstaller==6.22.3",  # keyring 번들링은 내장 hook-keyring.py에 의존(N-6)
    "ruff>=0.17.2",
    "setuptools>=84.2.1",
    "ty>=0.0.91",
]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdlogger"]

[tool.hatch.version]
path = "src/mdlogger/_version.py"

[tool.ruff]
# 런타임 업그레이드와 무관한 문법 재작성을 피하도록 기존 소스 형식을 유지한다.
target-version = "py313"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.src]
exclude = [".agents"]
