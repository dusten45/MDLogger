# local Supabase 개발 스택 설정(로드맵 결정 11: local 검증 + hosted production).
# `supabase start` / `supabase db reset` / `supabase test db`가 이 파일을 사용한다.
# 명시하지 않은 값은 Supabase CLI 기본값을 따른다.

project_id = "mdlogger"

[functions.guest-ingest]
# 게스트 클라이언트는 publishable(anon) key를 Bearer로 보낸다.
# 사용자 로그인 JWT는 요구하지 않는다(로드맵 8.3).
verify_jwt = true

[functions.account-delete]
# 파괴적 엔드포인트이므로 게이트웨이 JWT 검증을 명시적으로 켠다(하드닝 H-9).
# 기본값(true)과 일치하지만 CLI 기본값 의존을 제거한다.
verify_jwt = true

[functions.revoke-sessions]
# 세션 폐기·장치 정리를 수행하는 파괴적 엔드포인트이므로 게이트웨이 JWT 검증을
# 명시적으로 켠다(하드닝 D-6). 예약되지 않은 누가 호출해도 본인 세션만 폐기되지만,
# 유효한 로그인 세션 없이는 접근 자체를 차단한다.
verify_jwt = true

[functions.deck-catalog]
# 덱 목록 proxy. 로그인 access token을 요구한다(무분별한 proxy 사용 방지).
# 함수 내부에서도 getUser로 재검증한다(방어심도).
verify_jwt = true
