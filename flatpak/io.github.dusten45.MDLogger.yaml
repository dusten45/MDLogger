# MDLogger Flatpak manifest
#
# 배포 전략:
#   PyInstaller 대신 Python venv + pip 를 사용해 소스를 그대로 /app/venv 에 설치한다.
#   Windows 는 PyInstaller(Inno Setup)로, Linux 는 이 Flatpak 만으로 끝낸다.
#   사용자 데이터는 이미 XDG 경로( $XDG_DATA_HOME/mdlogger )로 분리되어 있어
#   샌드박스의 기본 데이터 디렉터리( ~/.var/app/<id>/data )에 자동 저장된다.
#
# 런타임: org.freedesktop.Platform 26.08 (SDK Python 3.14)
#   데스크톱 기본 Python 3.15와 함께 지원하는 최신 안정 런타임이다.
id: io.github.dusten45.MDLogger
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: mdlogger

finish-args:
    - --share=network # Supabase / decks.json 동기화, 릴리스 정책·환경 조회
    - --share=ipc # Qt 공유 메모리
    - --socket=x11
    - --socket=wayland
    - --device=dri # Qt 렌더링(GPU)
    - --talk-name=org.freedesktop.secrets # OS 키링(Secret Service) — refresh token 저장
    # 사용자 데이터는 샌드박스 기본 XDG_DATA_HOME(~/.var/app/<id>/data)이므로
    # 호스트 --filesystem 접근은 열지 않는다(더 안전).

modules:
    - name: mdlogger
      buildsystem: simple
      sources:
          # 저장소 루트를 그대로 사용한다(빌드 스크립트가 git archive 로 정리된 복사본을 만듦)
          - type: dir
            path: ..
      build-options:
          build-args:
              # 빌드 샌드박스는 기본적으로 네트워크가 없다(flatpak-builder 문서).
              # pip 가 PyPI(PySide6·numpy·build backend 등)를 받으려면 열어야 한다.
              - --share=network
          env:
              PIP_NO_CACHE_DIR: "1"
              PYTHONDONTWRITEBYTECODE: "1"
      build-commands:
          - python3 -m venv /app/venv
          # SDK에 포함된 pip의 이전 CA 번들을 피하도록 해시로 고정한 최신 pip를 먼저 설치한다.
          - /app/venv/bin/python -m pip install --no-deps "https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          # uv.lock에서 생성한 정확한 runtime pin과 platform marker를 먼저 적용한다.
          - /app/venv/bin/pip install --no-deps --require-hashes -r flatpak/requirements-runtime.txt
          # 프로젝트 설치가 lock closure를 다시 해석하거나 바꾸지 못하게 한다.
          - /app/venv/bin/pip install --no-deps .
          # pip는 빌드에만 필요하며 vendored dependency까지 포함하므로 final image에서 제거한다.
          - rm -rf /app/venv/lib/python3.14/site-packages/pip /app/venv/lib/python3.14/site-packages/pip-*.dist-info /app/venv/bin/pip /app/venv/bin/pip3 /app/venv/bin/pip3.14
          - test ! -e /app/venv/lib/python3.14/site-packages/pip
          - test ! -e /app/venv/bin/pip
          # 검사용 스캐너는 checkout에서 실행한다. 자체 탐지 문자열을 배포물에 넣지 않는다.
          - rm -f /app/venv/lib/python3.14/site-packages/mdlogger/secret_scan.py /app/venv/lib/python3.14/site-packages/mdlogger/__pycache__/secret_scan.*.pyc
          - test ! -e /app/venv/lib/python3.14/site-packages/mdlogger/secret_scan.py
          # Essentials wheel에 남아 있는 사용하지 않는 WebEngine/PDF 플러그인도 제외한다.
          - rm -f /app/venv/lib/python3.14/site-packages/PySide6/Qt/plugins/designer/libqwebengineview.so /app/venv/lib/python3.14/site-packages/PySide6/Qt/plugins/imageformats/libqpdf.so
          - rm -rf /app/venv/lib/python3.14/site-packages/PySide6/Qt/qml/QtQuick/Pdf
          - test ! -e /app/venv/lib/python3.14/site-packages/PySide6/Qt/plugins/designer/libqwebengineview.so
          - test ! -e /app/venv/lib/python3.14/site-packages/PySide6/Qt/plugins/imageformats/libqpdf.so
          - test ! -e /app/venv/lib/python3.14/site-packages/PySide6/Qt/qml/QtQuick/Pdf
          # 라이선스와 출처를 확인할 수 없는 pyqtgraph palette는 배포하지 않는다.
          - rm -f /app/venv/lib/python3.14/site-packages/pyqtgraph/colors/maps/PAL-relaxed.hex /app/venv/lib/python3.14/site-packages/pyqtgraph/colors/maps/PAL-relaxed_bright.hex
          - test ! -e /app/venv/lib/python3.14/site-packages/pyqtgraph/colors/maps/PAL-relaxed.hex
          - test ! -e /app/venv/lib/python3.14/site-packages/pyqtgraph/colors/maps/PAL-relaxed_bright.hex
          - mkdir -p /app/bin
          - printf '#!/bin/sh\nexec /app/venv/bin/mdlogger "$@"\n' > /app/bin/mdlogger
          - chmod +x /app/bin/mdlogger
          - install -Dm644 flatpak/io.github.dusten45.MDLogger.desktop /app/share/applications/io.github.dusten45.MDLogger.desktop
          # 같은 원본에서 생성한 512px 아이콘으로 Flatpak의 최대 크기 제한을 지킨다.
          - install -Dm644 web/public/pwa-512x512.png /app/share/icons/hicolor/512x512/apps/io.github.dusten45.MDLogger.png
          - install -Dm644 LICENSE /app/share/licenses/mdlogger/LICENSE
          - install -Dm644 THIRD_PARTY_NOTICES.txt /app/share/doc/mdlogger/THIRD_PARTY_NOTICES.txt
          - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/doc/mdlogger/THIRD_PARTY_NOTICES.md
          - cp -a licenses/desktop /app/share/licenses/mdlogger/desktop
          - install -Dm644 licenses/inventory/desktop-linux.json /app/share/licenses/mdlogger/inventory/desktop-linux.json
          - install -Dm644 licenses/inventory/qt-modules-linux-flatpak.json /app/share/licenses/mdlogger/inventory/qt-modules-linux-flatpak.json
          - install -Dm644 licenses/inventory/qt-third-party-runtime-linux-flatpak.json /app/share/licenses/mdlogger/inventory/qt-third-party-runtime-linux-flatpak.json
          - cp -a licenses/sources /app/share/doc/mdlogger/sources
          # Flatpak Builder strips/debug-splits native libraries after module commands; verify wheel bytes here and final-image bytes after finish.
          - python3 scripts/verify_flatpak_license_payload.py --app-root /app --payload-phase wheel
