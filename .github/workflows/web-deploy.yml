name: Deploy web

on:
    workflow_dispatch:
        inputs:
            target:
                description: 배포 대상 GitHub Environment
                required: true
                type: choice
                options:
                    - preview
                    - production
            worker_name:
                description: 배포할 Cloudflare Worker 이름
                required: true
                type: string
                default: mdlogger-web

permissions:
    contents: read

concurrency:
    group: mdlogger-web-${{ inputs.target }}
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy ${{ inputs.target }}
        if: ${{ inputs.target != 'production' || github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment:
            name: ${{ inputs.target }}
        defaults:
            run:
                working-directory: web
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_BUILD_ID: ${{ github.sha }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Validate deployment configuration
              run: |
                  test -n "$CLOUDFLARE_API_TOKEN"
                  test -n "$CLOUDFLARE_ACCOUNT_ID"
                  npm run check:deploy-env

            - name: Build static assets
              run: npm run build

            - name: Lint web source
              run: npm run lint

            - name: Run web tests
              run: npm test

            - name: Verify security headers are bundled
              run: test -f dist/_headers

            - name: Scan web bundle for server secrets
              run: npm run check:secrets

            - name: Deploy to Cloudflare Workers
              run: npx wrangler deploy --name "${{ inputs.worker_name }}"
