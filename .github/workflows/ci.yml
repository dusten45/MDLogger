name: CI

on:
    push:
        branches:
            - main
            - master
    pull_request:

jobs:
    validate:
        name: Lint, type-check, tests, secret scan
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up uv
              uses: astral-sh/setup-uv@v4
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: uv sync --group dev

            - name: Ruff lint
              run: uv run ruff check .

            - name: Ruff format check
              run: uv run ruff format --check .

            - name: Type check
              run: uv run ty check

            - name: Run tests
              run: uv run pytest

            # 빌드 산출물(번들 설정 모듈)에 service-role key·비밀 자격 증명이
            # 들어가지 않도록, 실제 빌드에서 사용하는 generate_build_config.py +
            # assert_not_secret + scan_file 파이프라인을 CI에서 실행한다
            # (하드닝 — docs/security-report.md §6.4). 안전한 더미 publishable 값으로
            # 산출 모듈을 만들 수 있어야 하고, secret 값은 거부되어야 한다.
            - name: Secret scan build config (positive)
              run: |
                  uv run python scripts/generate_build_config.py \
                    --url "https://example.supabase.co" \
                    --anon-key "sb_publishable_test_not_a_secret_key_abcdefgh" \
                    --dest "$RUNNER_TEMP/_bundled_config.py"

            - name: Secret scan build config (must reject secrets)
              run: |
                  if uv run python scripts/generate_build_config.py \
                    --url "https://user:pass@example.supabase.co" \
                    --anon-key "sb_secret_leaked_service_key_abcdefgh" \
                    --dest "$RUNNER_TEMP/_bundled_config_reject.py" ; then
                    echo "ERROR: secret value should have been rejected"; exit 1; fi
                  echo "secret rejection OK"
