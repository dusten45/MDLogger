name: CI

on:
    push:
        branches:
            - main
            - master
    pull_request:

jobs:
    validate:
        name: Lint, type-check, tests, secret scan
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up uv
              uses: astral-sh/setup-uv@v4
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: uv sync --group dev

            - name: Ruff lint
              run: uv run ruff check .

            - name: Ruff format check
              run: uv run ruff format --check .

            - name: Type check
              run: uv run ty check

            - name: Run tests
              run: uv run pytest

            # 빌드 산출물(번들 설정 모듈)에 service-role key·비밀 자격 증명이
            # 들어가지 않도록, 실제 빌드에서 사용하는 generate_build_config.py +
            # assert_not_secret + scan_file 파이프라인을 CI에서 실행한다
            # (하드닝 — docs/security-report.md §6.4). 안전한 더미 publishable 값으로
            # 산출 모듈을 만들 수 있어야 하고, secret 값은 거부되어야 한다.
            - name: Secret scan build config (positive)
              run: |
                  cat > .env <<'EOF'
                  MDLOGGER_SUPABASE_URL=https://example.supabase.co
                  MDLOGGER_SUPABASE_ANON_KEY=sb_publishable_test_not_a_secret_key_abcdefgh
                  EOF
                  uv run python scripts/generate_build_config.py \
                    --dest "$RUNNER_TEMP/_bundled_config.py"

            - name: Secret scan build config (must reject secrets)
              run: |
                  cat > .env <<'EOF'
                  MDLOGGER_SUPABASE_URL=https://user:pass@example.supabase.co
                  MDLOGGER_SUPABASE_ANON_KEY=sb_secret_leaked_service_key_abcdefgh
                  EOF
                  if uv run python scripts/generate_build_config.py \
                    --dest "$RUNNER_TEMP/_bundled_config_reject.py" ; then
                    echo "ERROR: secret value should have been rejected"; exit 1; fi
                  echo "secret rejection OK"

    web:
        name: Web build, lint, tests, secret scan
        runs-on: ubuntu-latest
        timeout-minutes: 20

        defaults:
            run:
                working-directory: web

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build static assets
              run: VITE_SUPABASE_URL=https://example.supabase.co VITE_SUPABASE_ANON_KEY=sb_publishable_test_not_a_secret_key_abcdefgh VITE_BUILD_ID=${{ github.sha }} npm run build

            - name: Lint web source
              run: npm run lint

            - name: Run web tests
              run: npm test

            - name: Verify security headers are bundled
              run: test -f dist/_headers

            - name: Scan web bundle for server secrets
              run: npm run check:secrets
